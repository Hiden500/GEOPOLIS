name: Doc & Repo Guardrails

# Deliberately has NO path filter (unlike ci.yml) — the violations this catches
# (stray root docs) live outside client/server/shared
# and would silently skip ci.yml entirely. See AGENTS.md documentation rules and
# docs/DECISIONS.md 2026-07-03 (gemini/ui-map-improvements cleanup) for the
# incident that motivated this check.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository agent configuration and docs
        run: python3 .agent/evals/public/run_public_evals.py

      - name: Reject stray root-level docs
        run: |
          allowlist="README.md AGENTS.md"
          offenders=""
          for f in $(git ls-files '*.md' | grep -v '/'); do
            if ! echo "$allowlist" | grep -qw "$f"; then
              offenders="$offenders $f"
            fi
          done
          if [ -n "$offenders" ]; then
            echo "::error::Root-level .md files outside the allowlist ($allowlist): $offenders"
            echo "::error::Task-tracking docs belong in docs/; do not add stray root-level tracking files."
            exit 1
          fi

      - name: Determine diff base
        id: diffbase
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="HEAD~1"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Flag AGENTS.md changes for manual review
        run: |
          if git diff --name-only "${{ steps.diffbase.outputs.base }}" HEAD -- AGENTS.md | grep -q .; then
            echo "::warning::AGENTS.md changed in this diff — process rules affect every future session, review the diff by hand before merging (not a failure, just a flag)."
          fi
